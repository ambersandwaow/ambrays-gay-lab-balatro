[manifest]
version = "1.0.0"
dump_lua = true
priority = 50


[[patches]]
[patches.pattern]
target = '=[SMODS GAIAMOD "main.lua"]'
pattern = '''return (G.GAME and G.GAME.round_resets.ante < 9) and 10 or false'''
position = 'at'
payload = '''
return next(SMODS.find_mod('ambray')) and not gaia_mod.config.yoink or false
'''
match_indent = true


[[patches]]
[patches.pattern]
target = '=[SMODS GAIAMOD "src/suits/suit1.lua"]'
pattern = '''{n = G.UIT.R, config = {align = "cl", padding = 0, minh = 0.1}, nodes = {}},'''
position = 'at'
payload = '''

--i love you gaia sorry about this <3
{n = G.UIT.R, config = {align = "cl", padding = 0, minh = 0.1}, nodes = {
    {n = G.UIT.C, config = { align = "cl", padding = 0.05 }, nodes = {
        create_toggle({label = "remove this mods music", ref_table = gaia_mod.config, ref_value = 'yoink'}),
    }}
}},

'''
match_indent = true


[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
G.SPLASH_BACK:define_draw_steps({{
        shader = 'splash', -- You can replace the shader altogether
        send = {
            {name = 'time', ref_table = G.TIMERS, ref_value = 'REAL_SHADER'},
            {name = 'vort_speed', val = 2},
             -- Here edit `ref_table` and `ref_value` with your own colors
            {name = 'colour_1', ref_table = G.C, ref_value = 'LOCCOLOURS2'},
            {name = 'colour_2', ref_table = G.C, ref_value = 'LOCCOLOURS'},
            {name = 'mid_flash', ref_table = splash_args, ref_value = 'mid_flash'},
            {name = 'vort_offset', val = 500},
        }}})
'''
# There is no nice way to replace backgrounds at the moment so an override is not a problem
# but keep an eye for SMODS features in the future
position = "at"
payload = '''
G.SPLASH_BACK:define_draw_steps({{
        shader = 'splash',
        send = {
            {name = 'time', ref_table = G.TIMERS, ref_value = 'REAL_SHADER'},
            {name = 'vort_speed', val = 2},
            {name = 'colour_1', ref_table = G.C, ref_value = 'lesGradOffset'},
            {name = 'colour_2', ref_table = G.C, ref_value = 'lesGrad'}, --lebiab
            {name = 'mid_flash', ref_table = splash_args, ref_value = 'mid_flash'},
            {name = 'vort_offset', val = 50},
        }
    }})
'''
match_indent = true
times = 1


[[patches]]
[patches.pattern]
target = '=[SMODS GAIAMOD "main.lua"]'
pattern = '''
SMODS.current_mod.menu_cards = function()
    return { -- This takes any SMODS.create_card parameters
        key = "j_gaia_ace",
        remove_original = true
    }
end
'''
position = 'at'
payload = '''
--[[ sorry gaia the gay thing in the main menu was cool i thought
i love youuu
SMODS.current_mod.menu_cards = function()
    return { -- This takes any SMODS.create_card parameters
        key = "j_gaia_ace",
        remove_original = true
    }
end
]]
'''
match_indent = true


[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''not show_win_cta and UIBox_button({button = 'go_to_menu', label = {localize('b_main_menu')}, minw = 2.5, maxw = 2.5, minh = 1, focus_args = {nav = 'wide'}}) or nil,'''
position = 'at'
payload = '''
not Ambray.canGay and not show_win_cta and UIBox_button({button = 'go_to_menu', label = {localize('b_main_menu')}, minw = 2.5, maxw = 2.5, minh = 1, focus_args = {nav = 'wide'}}) or nil,
Ambray.canGay and not show_win_cta and UIBox_button({button = 'ambrayGayLink', label = {'Gay Button'}, minw = 2.5, maxw = 2.5, minh = 1, focus_args = {nav = 'wide'}}) or nil,
'''
match_indent = true